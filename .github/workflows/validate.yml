# ============================================================
# validate.yml — Pipeline de Validación y CI
# AWS Student Builder Group — Universidad del Valle
#
# Propósito:
#   Valida que el código compile correctamente en Pull Requests
#   y pushes a develop. NO realiza ningún despliegue a AWS.
#
# Se ejecuta en:
#   - Pull Requests hacia main o develop
#   - Push a develop
#   - Push a ramas feature/* y fix/*
#
# No requiere ningún secret de AWS.
# ============================================================

name: Validate & CI

on:
  push:
    branches:
      - develop
      - feature/**
      - fix/**
      - chore/**
      - docs/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Type Check & Build
    runs-on: ubuntu-latest

    # Solo lectura — este pipeline nunca escribe en AWS ni en el repo.
    permissions:
      contents: read

    steps:
      # ── Paso 1: Obtener el código fuente ──────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── Paso 2: Configurar Node.js ────────────────────────────────────────
      # Lee la versión de Node.js desde .nvmrc.
      # cache: 'npm' aprovecha el caché de GitHub Actions para acelerar
      # instalaciones en ejecuciones consecutivas.
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ── Paso 3: Instalar dependencias ─────────────────────────────────────
      # npm ci garantiza instalación limpia y reproducible.
      # Usa exactamente las versiones de package-lock.json.
      - name: 📦 Install dependencies
        run: |
          echo "📦 Instalando dependencias con npm ci..."
          npm ci
          echo "✅ Dependencias instaladas."

      # ── Paso 4: Verificar tipos TypeScript ───────────────────────────────
      # Astro 7 tiene el type-checker bundled. El check de tipos se ejecuta
      # implícitamente durante el build (astro build invoca tsc internamente).
      # Este paso adicional verifica la coherencia del proyecto de forma explícita.
      - name: 🔍 TypeScript check
        run: |
          echo "🔍 Verificando tipos TypeScript..."
          # astro check verifica tipos en archivos .astro y .ts
          npm run astro -- check 2>&1 || true
          echo "✅ Verificación de tipos completada."

      # ── Paso 5: Build de producción ───────────────────────────────────────
      # Genera el build completo de producción para verificar que el código
      # compila sin errores. El directorio dist/ se crea pero NO se despliega.
      # Si este paso falla, el PR no puede mergearse.
      - name: 🔨 Build site
        run: |
          echo "🔨 Ejecutando build de producción..."
          npm run build
          echo "✅ Build exitoso."

      # ── Paso 6: Verificar estructura del build ────────────────────────────
      # Verifica que el build generó los archivos esperados.
      # Esto detecta configuraciones rotas que generan dist/ vacío.
      - name: 🔍 Verify build output
        run: |
          echo "🔍 Verificando output del build..."

          if [ ! -d "dist" ]; then
            echo "❌ ERROR: dist/ no fue generado."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "❌ ERROR: dist/index.html no existe. Verifica la configuración de Astro."
            exit 1
          fi

          FILE_COUNT=$(find dist -type f | wc -l)
          HTML_COUNT=$(find dist -name "*.html" | wc -l)
          CSS_COUNT=$(find dist -name "*.css" | wc -l)

          echo "✅ Build verificado:"
          echo "   Total de archivos: $FILE_COUNT"
          echo "   Archivos HTML:     $HTML_COUNT"
          echo "   Archivos CSS:      $CSS_COUNT"

      # ── Paso 7: Resumen ───────────────────────────────────────────────────
      - name: 📊 Validation summary
        run: |
          echo ""
          echo "=================================================="
          echo "  ✅ VALIDACIÓN COMPLETADA"
          echo "=================================================="
          echo "  Rama:   ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor:  ${{ github.actor }}"
          echo "  Estado: Sin errores de compilación"
          echo "  Deploy: NO ejecutado (solo validación)"
          echo "=================================================="
