# ============================================================
# deploy.yml — Pipeline de Despliegue
# AWS Student Builder Group — Universidad del Valle
#
# Propósito:
#   Construye el sitio Astro y lo despliega automáticamente
#   en Amazon S3 + CloudFront cada vez que se hace push a
#   main o develop.
#
# Autenticación:
#   Usa OIDC (OpenID Connect) — sin access keys estáticas.
#   GitHub solicita un token temporal a AWS vía
#   sts:AssumeRoleWithWebIdentity.
#
# GitHub Secrets requeridos (Settings → Environments):
#   AWS_ROLE_ARN               — ARN del IAM Role para OIDC
#   AWS_REGION                 — Región del bucket S3 (ej: us-east-1)
#   AWS_BUCKET_NAME            — Nombre del bucket S3
#   CLOUDFRONT_DISTRIBUTION_ID — ID de la distribución CloudFront
# ============================================================

name: Deploy

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.ref_name }}-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest

    # Selecciona automáticamente el Environment
    environment: ${{ github.ref_name == 'main' && 'Production' || 'development' }}

    permissions:
      id-token: write
      contents: read

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --------------------------------------------------------
      # Instalar dependencias
      # --------------------------------------------------------
      - name: 📦 Install dependencies
        run: |
          echo "📦 Instalando dependencias con npm ci..."
          npm ci
          echo "✅ Dependencias instaladas correctamente."

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: 🔨 Build site
        run: |
          echo "🔨 Iniciando build..."
          npm run build
          echo "✅ Build completado. Archivos generados en /dist."

      # --------------------------------------------------------
      # Verificar dist/
      # --------------------------------------------------------
      - name: 🔍 Verify dist directory
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ ERROR: El directorio dist/ no existe."
            exit 1
          fi

          if [ -z "$(ls -A dist)" ]; then
            echo "❌ ERROR: El directorio dist/ está vacío."
            exit 1
          fi

          FILE_COUNT=$(find dist -type f | wc -l)
          echo "✅ dist/ existe y contiene $FILE_COUNT archivos."

      # --------------------------------------------------------
      # Autenticación AWS mediante OIDC
      # --------------------------------------------------------
      - name: 🔐 Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      # --------------------------------------------------------
      # Subir assets con hash
      # --------------------------------------------------------
      - name: ☁️ Sync hashed assets to S3 (cache: 1 year)
        run: |
          aws s3 sync dist/_astro/ "s3://${{ secrets.AWS_BUCKET_NAME }}/_astro/" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

      # --------------------------------------------------------
      # Subir HTML y archivos raíz
      # --------------------------------------------------------
      - name: 📄 Sync HTML and root files to S3 (no-cache)
        run: |
          aws s3 sync dist/ "s3://${{ secrets.AWS_BUCKET_NAME }}/" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "_astro/*" \
            --delete \
            --no-progress

      # --------------------------------------------------------
      # Invalidar CloudFront
      # --------------------------------------------------------
      - name: 🔄 Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "✅ Invalidación creada: $INVALIDATION_ID"

      # --------------------------------------------------------
      # Resumen
      # --------------------------------------------------------
      - name: 🎉 Deployment summary
        run: |
          echo "=================================================="
          echo "🎉 DESPLIEGUE COMPLETADO"
          echo "=================================================="
          echo "Ambiente: ${{ github.ref_name == 'main' && 'Production' || 'development' }}"
          echo "Rama:      ${{ github.ref_name }}"
          echo "Commit:    ${{ github.sha }}"
          echo "Actor:     ${{ github.actor }}"
          echo "=================================================="
