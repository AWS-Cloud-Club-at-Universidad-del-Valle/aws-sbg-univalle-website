# ============================================================
# deploy.yml — Pipeline de Despliegue
# AWS Student Builder Group — Universidad del Valle
#
# Propósito:
# Construye el sitio Astro y lo despliega automáticamente
# en Amazon S3 + CloudFront cada vez que se hace push a
# main o develop.
#
# Infraestructura (gestionada por CDK):
#
# dev-sbg-univalle-frontend     ← bucket dev (rama develop)
# prod-sbg-univalle-frontend    ← bucket prod (rama main)
#
# Cada ambiente tiene su propio bucket y CloudFront.
#
# Autenticación:
# Usa OIDC (OpenID Connect) — sin access keys estáticas.
#
# GitHub Secrets requeridos (por Environment):
# AWS_ROLE_ARN
# AWS_REGION
# AWS_BUCKET_NAME
# CLOUDFRONT_DISTRIBUTION_ID
# ============================================================

name: Deploy

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.ref_name }}-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest
    # Selecciona el Environment de GitHub dependiendo de la rama.
    #
    # main    → Production
    # develop → development
    environment: ${{ github.ref_name == 'main' && 'Production' || 'development' }}

    permissions:
      id-token: write
      contents: read

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --------------------------------------------------------
      # Instalar dependencias
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          echo "Instalando dependencias con npm ci..."
          npm ci
          echo "Dependencias instaladas correctamente."

      # --------------------------------------------------------
      # Build
      #
      # Inyecta la URL de la API de Eventos según la rama:
      #   main    → API de producción (/prod)
      #   develop → API de desarrollo (/dev)
      # --------------------------------------------------------
      - name: Build site
        env:
          PUBLIC_EVENTS_API_URL: ${{ github.ref_name == 'main' && 'https://4fi9ot44ml.execute-api.us-east-1.amazonaws.com/prod' || 'https://orj83oh0pc.execute-api.us-east-1.amazonaws.com/dev' }}
          # CDN de assets (imágenes) según la rama: prod en main, dev en develop.
          PUBLIC_ASSETS_CDN_URL: ${{ github.ref_name == 'main' && 'https://d2zjot7yvduv1u.cloudfront.net' || 'https://d23d5d88jw9p2.cloudfront.net' }}
          PUBLIC_ASSETS_MEMBERS_PATH: ${{ github.ref_name == 'main' && 'members' || 'dev-members/photos-members' }}
          PUBLIC_ASSETS_LOGOS_PATH: ${{ github.ref_name == 'main' && 'prod-assets/prod-logos' || 'dev-assets/dev-logos' }}
        run: |
          echo "Iniciando build..."
          echo "API de Eventos: ${PUBLIC_EVENTS_API_URL}"
          echo "CDN de assets:  ${PUBLIC_ASSETS_CDN_URL}"
          npm run build
          echo "Build completado. Archivos generados en /dist."

      # --------------------------------------------------------
      # Verificar dist/
      # --------------------------------------------------------
      - name: Verify dist directory
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: El directorio dist/ no existe."
            exit 1
          fi
          if [ -z "$(ls -A dist)" ]; then
            echo "ERROR: El directorio dist/ está vacío."
            exit 1
          fi
          FILE_COUNT=$(find dist -type f | wc -l)
          echo "dist/ existe y contiene $FILE_COUNT archivos."

      # --------------------------------------------------------
      # Autenticación AWS mediante OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      # --------------------------------------------------------
      # Subir assets con hash (cache largo)
      # --------------------------------------------------------
      - name: Sync hashed assets to S3 (cache 1 year)
        run: |
          echo "Subiendo assets a:"
          echo "s3://${{ secrets.AWS_BUCKET_NAME }}/_astro/"

          aws s3 sync dist/_astro/ \
            "s3://${{ secrets.AWS_BUCKET_NAME }}/_astro/" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

      # --------------------------------------------------------
      # Subir HTML y archivos raíz (sin cache)
      # --------------------------------------------------------
      - name: Sync HTML and root files to S3 (no-cache)
        run: |
          echo "Subiendo archivos del sitio a:"
          echo "s3://${{ secrets.AWS_BUCKET_NAME }}/"

          aws s3 sync dist/ \
            "s3://${{ secrets.AWS_BUCKET_NAME }}/" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "_astro/*" \
            --delete \
            --no-progress

      # --------------------------------------------------------
      # Invalidar CloudFront
      # --------------------------------------------------------
      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidando CloudFront..."
          echo "Distribution ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Invalidacion creada: $INVALIDATION_ID"

      # --------------------------------------------------------
      # Resumen
      # --------------------------------------------------------
      - name: Deployment summary
        run: |
          echo "=================================================="
          echo "DESPLIEGUE COMPLETADO"
          echo "=================================================="
          echo "Ambiente: ${{ github.ref_name == 'main' && 'Production' || 'development' }}"
          echo "Rama:     ${{ github.ref_name }}"
          echo "Bucket:   ${{ secrets.AWS_BUCKET_NAME }}"
          echo "Commit:   ${{ github.sha }}"
          echo "Actor:    ${{ github.actor }}"
          echo "=================================================="
